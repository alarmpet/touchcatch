project_id = "touchcatch"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = false
port = 55329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 55324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["spotlearn://auth/callback", "spotlearn://auth/recovery"]
jwt_expiry = 3600
enable_signup = true
enable_manual_linking = true

[auth.email]
enable_confirmations = true

[analytics]
enabled = true
port = 55327
backend = "postgres"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 55328
