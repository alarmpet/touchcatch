# Non-public planning artifact. These operations are NOT in the Android closed-beta
# HTTP runtime. Public contract: packages/contracts/openapi.yaml.
openapi: 3.1.0
info: { title: TouchCatch API (planned, not implemented), version: 1.0.0-planned, license: { name: Proprietary, identifier: LicenseRef-Proprietary } }
servers: [{ url: https://api.example.invalid }]
security: [{ bearerAuth: [] }]
paths:
  /v1/me:
    get:
      operationId: getMe
      summary: Get the authenticated profile
      responses: { "200": { $ref: "#/components/responses/MeResponse" }, "401": { $ref: "#/components/responses/MeError" } }
  /v1/pets:
    get:
      operationId: listPets
      summary: List owned pets
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses: { "200": { $ref: "#/components/responses/PetsResponse" }, "401": { $ref: "#/components/responses/PetsError" } }
  /v1/pets/collection:
    get:
      operationId: getPetCollectionV1
      summary: Get the authenticated pet collection projection
      responses: { "200": { $ref: "#/components/responses/PetCollectionResponse" }, "400": { $ref: "#/components/responses/PetRuntimeInvalidError" }, "401": { $ref: "#/components/responses/PetRuntimeUnauthorizedError" }, "409": { $ref: "#/components/responses/PetRuntimePolicyError" }, "503": { $ref: "#/components/responses/PetRuntimeUnavailableError" } }
  /v1/learning/leaderboard:
    get:
      operationId: getWeeklyCategoryLeaderboardV1
      summary: Get one server-authoritative weekly category board
      parameters:
        - { name: seasonId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: category, in: query, required: true, schema: { type: string, enum: [ENGLISH, PROVERB] } }
        - { name: limit, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 10 } }
      responses: { "200": { $ref: "#/components/responses/WeeklyCategoryBoardResponse" }, "400": { $ref: "#/components/responses/LeaderboardInvalidQueryError" }, "401": { $ref: "#/components/responses/LeaderboardUnauthorizedError" }, "409": { $ref: "#/components/responses/LeaderboardPolicyError" }, "503": { $ref: "#/components/responses/LeaderboardUnavailableError" } }
  /v1/pets/daily-draw:
    post:
      operationId: claimDailyFreeDrawV1
      summary: Claim the effect-once free draw for the server-derived KST date
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses: { "200": { $ref: "#/components/responses/DailyFreeDrawResponse" }, "400": { $ref: "#/components/responses/PetRuntimeInvalidError" }, "401": { $ref: "#/components/responses/PetRuntimeUnauthorizedError" }, "409": { $ref: "#/components/responses/PetRuntimePolicyError" }, "503": { $ref: "#/components/responses/PetRuntimeUnavailableError" } }
  /v1/pets/duplicate-promotion:
    post:
      operationId: promoteDuplicateCardsV1
      summary: Consume ten spare copies of one pet and promote to the next rarity
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/DuplicatePromotionRequest" }
      responses: { "200": { $ref: "#/components/responses/DuplicatePromotionResponse" }, "400": { $ref: "#/components/responses/DuplicatePromotionInvalidError" }, "401": { $ref: "#/components/responses/PetRuntimeUnauthorizedError" }, "404": { $ref: "#/components/responses/DuplicatePromotionNotOwnedError" }, "409": { $ref: "#/components/responses/DuplicatePromotionConflictError" }, "503": { $ref: "#/components/responses/PetRuntimeUnavailableError" } }
  /v1/learning/challenges:
    get:
      operationId: getWeeklyChallengesV1
      summary: List the content revisions this season pinned, without any answer material
      parameters:
        - { name: seasonId, in: query, required: true, schema: { type: string, format: uuid } }
      responses: { "200": { $ref: "#/components/responses/WeeklyChallengesResponse" }, "400": { $ref: "#/components/responses/AttemptInvalidError" }, "401": { $ref: "#/components/responses/AttemptUnauthorizedError" }, "404": { $ref: "#/components/responses/AttemptNotFoundError" }, "409": { $ref: "#/components/responses/AttemptConflictError" }, "503": { $ref: "#/components/responses/AttemptUnavailableError" } }
  /v1/learning/attempts:
    post:
      operationId: startLearningAttemptV1
      summary: Open one ranked attempt session with a server-issued start time
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/AttemptStartRequest" }
      responses: { "200": { $ref: "#/components/responses/AttemptStartResponse" }, "400": { $ref: "#/components/responses/AttemptInvalidError" }, "401": { $ref: "#/components/responses/AttemptUnauthorizedError" }, "404": { $ref: "#/components/responses/AttemptNotFoundError" }, "409": { $ref: "#/components/responses/AttemptConflictError" }, "503": { $ref: "#/components/responses/AttemptUnavailableError" } }
  /v1/learning/attempts/{id}/assets-ready:
    post:
      operationId: attestLearningAttemptAssetsV1
      summary: Stamp the server-issued assets-ready time that starts the scoring clock
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/AttemptAssetsReadyRequest" }
      responses: { "200": { $ref: "#/components/responses/AttemptAssetsReadyResponse" }, "400": { $ref: "#/components/responses/AttemptInvalidError" }, "401": { $ref: "#/components/responses/AttemptUnauthorizedError" }, "404": { $ref: "#/components/responses/AttemptNotFoundError" }, "409": { $ref: "#/components/responses/AttemptConflictError" }, "503": { $ref: "#/components/responses/AttemptUnavailableError" } }
  /v1/learning/attempts/{id}/tap:
    post:
      operationId: tapLearningAttemptV1
      summary: Resolve one tap server-side and return at most one revealed answer unit
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/AttemptTapRequest" }
      responses: { "200": { $ref: "#/components/responses/AttemptTapResponse" }, "400": { $ref: "#/components/responses/AttemptInvalidError" }, "401": { $ref: "#/components/responses/AttemptUnauthorizedError" }, "404": { $ref: "#/components/responses/AttemptNotFoundError" }, "409": { $ref: "#/components/responses/AttemptConflictError" }, "503": { $ref: "#/components/responses/AttemptUnavailableError" } }
  /v1/learning/attempts/{id}/complete:
    post:
      operationId: completeLearningAttemptV1
      summary: Submit the attempt command log for server verification and ranked commit
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/AttemptCompleteRequest" }
      responses: { "200": { $ref: "#/components/responses/AttemptCompleteResponse" }, "400": { $ref: "#/components/responses/AttemptInvalidError" }, "401": { $ref: "#/components/responses/AttemptUnauthorizedError" }, "404": { $ref: "#/components/responses/AttemptNotFoundError" }, "409": { $ref: "#/components/responses/AttemptConflictError" }, "503": { $ref: "#/components/responses/AttemptUnavailableError" } }
  /v1/pets/{id}/select:
    post:
      operationId: selectPet
      summary: Select an owned pet
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses: { "200": { $ref: "#/components/responses/SelectPetResponse" }, "404": { $ref: "#/components/responses/SelectPetNotOwnedError" }, "409": { $ref: "#/components/responses/SelectPetConflictError" } }
  /v1/pets/{id}/lock:
    post:
      operationId: lockPet
      summary: Change an owned pet lock
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/LockPetRequest" }
      responses: { "200": { $ref: "#/components/responses/LockPetResponse" }, "404": { $ref: "#/components/responses/LockPetNotOwnedError" }, "409": { $ref: "#/components/responses/LockPetConflictError" } }
  /v1/gacha/draw:
    post:
      operationId: drawGacha
      summary: Draw a pet
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses: { "200": { $ref: "#/components/responses/GachaDrawResponse" }, "409": { $ref: "#/components/responses/GachaDrawConflictError" } }
  /v1/fusion:
    post:
      operationId: fusePets
      summary: Fuse exactly five eligible same-rarity copies
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/FusionRequest" }
      responses: { "200": { $ref: "#/components/responses/FusionResponse" }, "400": { $ref: "#/components/responses/FusionInvalidMaterialsError" }, "404": { $ref: "#/components/responses/FusionNotOwnedError" }, "409": { $ref: "#/components/responses/FusionConflictError" } }
  /v1/matches/queue:
    post:
      operationId: createQueueTicket
      summary: Create a matchmaking ticket
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/QueueCreateRequest" }
      responses: { "202": { $ref: "#/components/responses/QueueTicketResponse" }, "400": { $ref: "#/components/responses/QueueCreateError" }, "409": { $ref: "#/components/responses/QueueCreateError" } }
  /v1/matches/queue/{ticketId}:
    get:
      operationId: getQueueTicket
      summary: Read a matchmaking ticket
      parameters: [{ $ref: "#/components/parameters/TicketId" }]
      responses: { "200": { $ref: "#/components/responses/QueueTicketResponse" }, "401": { $ref: "#/components/responses/QueueGetError" }, "404": { $ref: "#/components/responses/QueueGetError" } }
    delete:
      operationId: cancelQueueTicket
      summary: Cancel a matchmaking ticket
      parameters: [{ $ref: "#/components/parameters/TicketId" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses: { "200": { $ref: "#/components/responses/QueueCancelResponse" }, "404": { $ref: "#/components/responses/QueueCancelError" }, "409": { $ref: "#/components/responses/QueueCancelError" } }
  /v1/matches/friend-room:
    post:
      operationId: createFriendRoom
      summary: Create a friend room
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/FriendRoomCreateRequest" }
      responses: { "201": { $ref: "#/components/responses/FriendRoomResponse" }, "400": { $ref: "#/components/responses/FriendRoomCreateError" }, "409": { $ref: "#/components/responses/FriendRoomCreateError" } }
  /v1/matches/friend-room/{roomCode}/join:
    post:
      operationId: joinFriendRoom
      summary: Join a friend room
      parameters: [{ $ref: "#/components/parameters/RoomCode" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/FriendRoomJoinRequest" }
      responses: { "200": { $ref: "#/components/responses/FriendRoomResponse" }, "400": { $ref: "#/components/responses/FriendRoomJoinError" }, "404": { $ref: "#/components/responses/FriendRoomJoinError" }, "409": { $ref: "#/components/responses/FriendRoomJoinError" } }
  /v1/matches/friend-room/{roomCode}/members/me:
    delete:
      operationId: leaveFriendRoom
      summary: Leave a friend room
      parameters: [{ $ref: "#/components/parameters/RoomCode" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses: { "200": { $ref: "#/components/responses/FriendRoomLeaveResponse" }, "404": { $ref: "#/components/responses/FriendRoomLeaveError" }, "409": { $ref: "#/components/responses/FriendRoomLeaveError" } }
  /v1/pet-showcases/{nickname}:
    get:
      operationId: getPetShowcaseV1
      summary: Get a public-safe pet showcase
      security: []
      parameters: [{ $ref: "#/components/parameters/Nickname" }]
      responses: { "200": { $ref: "#/components/responses/PetShowcaseResponse" }, "404": { $ref: "#/components/responses/PetShowcaseNotFoundError" } }
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT } }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
    TicketId: { name: ticketId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
    RoomCode: { name: roomCode, in: path, required: true, schema: { type: string, pattern: "^[A-Z0-9]{6,12}$" } }
    Nickname: { name: nickname, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 32 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$" } }
  requestBodies:
    LockPetRequest: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LockPetRequest" } } } }
    FusionRequest: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FusionRequest" } } } }
    DuplicatePromotionRequest: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DuplicatePromotionRequest" } } } }
    AttemptStartRequest: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AttemptStartRequest" } } } }
    AttemptAssetsReadyRequest: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AttemptAssetsReadyRequest" } } } }
    AttemptCompleteRequest: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AttemptCompleteRequest" } } } }
    AttemptTapRequest: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AttemptTapRequest" } } } }
    QueueCreateRequest: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/QueueCreateRequest" } } } }
    FriendRoomCreateRequest: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FriendRoomCreateRequest" } } } }
    FriendRoomJoinRequest: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FriendRoomJoinRequest" } } } }
  schemas:
    LockPetRequest: { type: object, additionalProperties: false, required: [locked], properties: { locked: { type: boolean } } }
    FusionRequest: { type: object, additionalProperties: false, required: [materials], properties: { materials: { type: array, minItems: 1, maxItems: 5, x-runtime-validation: { exactCountSum: 5, uniqueBy: userPetId }, items: { type: object, additionalProperties: false, required: [userPetId, count], properties: { userPetId: { type: string, format: uuid }, count: { type: integer, minimum: 1, maximum: 5 } } } } } }
    DuplicatePromotionRequest: { type: object, additionalProperties: false, required: [materials], properties: { materials: { type: array, minItems: 1, maxItems: 1, x-runtime-validation: { exactCountSum: 10, samePetOnly: true }, items: { type: object, additionalProperties: false, required: [petId, count], properties: { petId: { type: string, format: uuid }, count: { type: integer, const: 10 } } } } } }
    QueueCreateRequest: { type: object, additionalProperties: false, maxProperties: 0 }
    FriendRoomCreateRequest: { type: object, additionalProperties: false, maxProperties: 0 }
    FriendRoomJoinRequest: { type: object, additionalProperties: false, maxProperties: 0 }
    MeResponse: { type: object, additionalProperties: false, required: [profile, points], properties: { profile: { type: object, additionalProperties: false, required: [displayName], properties: { displayName: { type: string } } }, points: { type: integer, minimum: 0 } } }
    PetsResponse: { type: object, additionalProperties: false, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: "#/components/schemas/Pet" } }, nextCursor: { type: [string, "null"], maxLength: 512 } } }
    Pet: { type: object, additionalProperties: false, required: [id, catalogId, level, exp, copies, selected, locked], properties: { id: { type: string }, catalogId: { type: string }, level: { type: integer, minimum: 1 }, exp: { type: integer, minimum: 0 }, copies: { type: integer, minimum: 1 }, selected: { type: boolean }, locked: { type: boolean } } }
    SelectPetResponse: { type: object, additionalProperties: false, required: [petId, selected], properties: { petId: { type: string, format: uuid }, selected: { const: true } } }
    LockPetResponse: { type: object, additionalProperties: false, required: [petId, locked], properties: { petId: { type: string, format: uuid }, locked: { type: boolean } } }
    GachaDrawResponse: { type: object, additionalProperties: false, required: [userPetId, petId, rarity, pointsRemaining, rareCounter, legendaryCounter, economyVersion, economyHash, catalogRevision, catalogHash, pitySeriesId, pitySemanticsHash], properties: { userPetId: { type: string, format: uuid }, petId: { type: string, format: uuid }, rarity: { enum: [COMMON, UNCOMMON, RARE, EPIC, LEGENDARY] }, pointsRemaining: { type: integer, minimum: 0 }, rareCounter: { type: integer, minimum: 0, maximum: 49 }, legendaryCounter: { type: integer, minimum: 0, maximum: 149 }, economyVersion: { type: string }, economyHash: { type: string, pattern: "^[0-9a-f]{64}$" }, catalogRevision: { type: string }, catalogHash: { type: string, pattern: "^[0-9a-f]{64}$" }, pitySeriesId: { type: string }, pitySemanticsHash: { type: string, pattern: "^[0-9a-f]{64}$" } } }
    FusionResponse: { type: object, additionalProperties: false, required: [consumed, output, economyVersion, economyHash, catalogRevision, catalogHash], properties: { consumed: { type: array, items: { type: object, additionalProperties: false, required: [userPetId, count], properties: { userPetId: { type: string, format: uuid }, count: { type: integer, minimum: 1 } } } }, output: { type: object, additionalProperties: false, required: [userPetId, petId, rarity], properties: { userPetId: { type: string, format: uuid }, petId: { type: string, format: uuid }, rarity: { enum: [UNCOMMON, RARE, EPIC, LEGENDARY] } } }, economyVersion: { type: string }, economyHash: { type: string, pattern: "^[0-9a-f]{64}$" }, catalogRevision: { type: string }, catalogHash: { type: string, pattern: "^[0-9a-f]{64}$" } } }
    ApprovedPetArt: { type: object, additionalProperties: false, required: [thumbnailUrl, thumbnailSha256, fullUrl, fullSha256], properties: { thumbnailUrl: { type: string, format: uri, pattern: "^https://" }, thumbnailSha256: { type: string, pattern: "^[0-9a-f]{64}$" }, fullUrl: { type: string, format: uri, pattern: "^https://" }, fullSha256: { type: string, pattern: "^[0-9a-f]{64}$" } } }
    DailyFreeDrawResponse: { type: object, additionalProperties: false, required: [claimDate, seriesId, pet, economyVersion, economyHash, catalogRevision, catalogHash], properties: { claimDate: { type: string, format: date }, seriesId: { const: DAILY_FREE_DRAW_V1 }, pet: { type: object, additionalProperties: false, required: [userPetId, petId, rarity, copies], properties: { userPetId: { type: string, format: uuid }, petId: { type: string, format: uuid }, rarity: { enum: [COMMON, UNCOMMON, RARE, EPIC, LEGENDARY] }, copies: { type: integer, minimum: 1 } } }, economyVersion: { type: string }, economyHash: { type: string, pattern: "^[0-9a-f]{64}$" }, catalogRevision: { type: string }, catalogHash: { type: string, pattern: "^[0-9a-f]{64}$" } } }
    DuplicatePromotionResponse: { type: object, additionalProperties: false, required: [consumed, remainingCopies, output, economyVersion, economyHash, catalogRevision, catalogHash], properties: { consumed: { type: object, additionalProperties: false, required: [petId, copies, rows], properties: { petId: { type: string, format: uuid }, copies: { const: 10 }, rows: { type: array, minItems: 1, items: { type: object, additionalProperties: false, required: [userPetId, copies], properties: { userPetId: { type: string, format: uuid }, copies: { type: integer, minimum: 1 } } } } } }, remainingCopies: { type: integer, minimum: 1 }, output: { type: object, additionalProperties: false, required: [userPetId, petId, rarity, copies], properties: { userPetId: { type: string, format: uuid }, petId: { type: string, format: uuid }, rarity: { enum: [UNCOMMON, RARE, EPIC, LEGENDARY] }, copies: { type: integer, minimum: 1 } } }, economyVersion: { type: string }, economyHash: { type: string, pattern: "^[0-9a-f]{64}$" }, catalogRevision: { type: string }, catalogHash: { type: string, pattern: "^[0-9a-f]{64}$" } } }
    PetCollectionResponse: { type: object, additionalProperties: false, required: [claimedToday, ownedCount, totalCount, rarityProgress, pets], properties: { claimedToday: { type: boolean }, ownedCount: { type: integer, minimum: 0 }, totalCount: { type: integer, minimum: 0 }, rarityProgress: { type: object, additionalProperties: false, required: [COMMON, UNCOMMON, RARE, EPIC, LEGENDARY], properties: { COMMON: { $ref: "#/components/schemas/RarityProgress" }, UNCOMMON: { $ref: "#/components/schemas/RarityProgress" }, RARE: { $ref: "#/components/schemas/RarityProgress" }, EPIC: { $ref: "#/components/schemas/RarityProgress" }, LEGENDARY: { $ref: "#/components/schemas/RarityProgress" } } }, pets: { type: array, items: { $ref: "#/components/schemas/PetCollectionItem" } } } }
    RarityProgress: { type: object, additionalProperties: false, required: [ownedCount, totalCount], properties: { ownedCount: { type: integer, minimum: 0 }, totalCount: { type: integer, minimum: 0 } } }
    PetCollectionItem: { type: object, additionalProperties: false, required: [userPetId, petId, rarity, displayKey, level, xp, copies, selected, locked, acquiredAt, acquisitionDateStatus, art], properties: { userPetId: { type: string }, petId: { type: string }, rarity: { enum: [COMMON, UNCOMMON, RARE, EPIC, LEGENDARY] }, displayKey: { type: string }, level: { type: integer, minimum: 1 }, xp: { type: integer, minimum: 0 }, copies: { type: integer, minimum: 1 }, selected: { type: boolean }, locked: { type: boolean }, acquiredAt: { oneOf: [{ type: string, format: date-time }, { type: "null" }] }, acquisitionDateStatus: { enum: [KNOWN, UNAVAILABLE_LEGACY] }, art: { $ref: "#/components/schemas/ApprovedPetArt" } }, allOf: [{ if: { properties: { acquisitionDateStatus: { const: KNOWN } } }, then: { properties: { acquiredAt: { type: string, format: date-time } } }, else: { properties: { acquiredAt: { type: "null" } } } }] }
    ShowcasePet: { type: object, additionalProperties: false, required: [petId, displayKey, rarity, art], properties: { petId: { type: string }, displayKey: { type: string }, rarity: { enum: [COMMON, UNCOMMON, RARE, EPIC, LEGENDARY] }, art: { $ref: "#/components/schemas/ApprovedPetArt" } } }
    PetShowcaseResponse: { type: object, additionalProperties: false, required: [nickname, selectedPet, favoritePets, collectionPercentage, championStarCount, historicalNumberOneCount, approvedCosmetics], properties: { nickname: { type: string, minLength: 1, maxLength: 32 }, selectedPet: { oneOf: [{ $ref: "#/components/schemas/ShowcasePet" }, { type: "null" }] }, favoritePets: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/ShowcasePet" } }, collectionPercentage: { type: number, minimum: 0, maximum: 100 }, championStarCount: { type: integer, minimum: 0 }, historicalNumberOneCount: { type: integer, minimum: 0 }, approvedCosmetics: { type: array, items: { type: object, additionalProperties: false, required: [cosmeticId, displayKey], properties: { cosmeticId: { type: string }, displayKey: { type: string } } } } } }
    WeeklyCategoryBoardResponse: { type: object, additionalProperties: false, required: [seasonId, category, snapshotRevision, rows, myRank], properties: { seasonId: { type: string, format: uuid }, category: { type: string, enum: [ENGLISH, PROVERB] }, snapshotRevision: { type: string, minLength: 1 }, rows: { type: array, maxItems: 10, items: { type: object, additionalProperties: false, required: [rank, nickname, displayScore], properties: { rank: { type: integer, minimum: 1 }, nickname: { type: string, minLength: 1, maxLength: 32 }, displayScore: { type: integer, minimum: 0 } } } }, myRank: { oneOf: [{ type: object, additionalProperties: false, required: [rank, totalCompetitors, percentile, displayScore], properties: { rank: { type: integer, minimum: 1 }, totalCompetitors: { type: integer, minimum: 1 }, percentile: { type: number, minimum: 0, maximum: 100 }, displayScore: { type: integer, minimum: 0 } } }, { type: "null" }] } } }
    QueueTicketResponse: { type: object, additionalProperties: false, required: [ticketId, status], properties: { ticketId: { type: string }, status: { type: string, enum: [QUEUED, MATCHED] } } }
    QueueCancelResponse: { type: object, additionalProperties: false, required: [cancelled], properties: { cancelled: { const: true } } }
    FriendRoomResponse: { type: object, additionalProperties: false, required: [roomCode, memberCount], properties: { roomCode: { type: string }, memberCount: { type: integer, minimum: 1, maximum: 2 } } }
    FriendRoomLeaveResponse: { type: object, additionalProperties: false, required: [left], properties: { left: { const: true } } }
    MeError: &unauthorized { type: object, additionalProperties: false, required: [code], properties: { code: { type: string, enum: [UNAUTHORIZED] } } }
    PetsError: *unauthorized
    SelectPetNotOwnedError: &notOwnedError { type: object, additionalProperties: false, required: [code], properties: { code: { type: string, enum: [NOT_OWNED] } } }
    SelectPetConflictError: &idempotencyError { type: object, additionalProperties: false, required: [code], properties: { code: { type: string, enum: [IDEMPOTENCY_CONFLICT] } } }
    LockPetNotOwnedError: *notOwnedError
    LockPetConflictError: *idempotencyError
    GachaDrawConflictError: { type: object, additionalProperties: false, required: [code], properties: { code: { type: string, enum: [IDEMPOTENCY_CONFLICT, POLICY_MISMATCH, INSUFFICIENT_FUNDS] } } }
    FusionInvalidMaterialsError: { type: object, additionalProperties: false, required: [code], properties: { code: { type: string, enum: [INVALID_MATERIALS] } } }
